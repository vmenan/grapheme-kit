site_name: GraphemesKit - Documentation
site_description: A grapheme-aware toolkit for linguistically fair NLP evaluation, with deep Tamil and Sinhala script support
site_author: vmenan
site_url: https://vmenan.github.io/grapheme-kit/

repo_name: vmenan/grapheme-kit
repo_url: https://github.com/vmenan/grapheme-kit

theme:
  name: material
  custom_dir: overrides
  favicon: assets/icon.svg
  logo: assets/icon.svg
  font:
    text: Outfit
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vmenan/grapheme-kit

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      toc_depth: 3

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js


extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - Tutorials:
    - Introduction: tutorials/introduction.md
    - Measuring Quality: tutorials/metrics.md
    - Segmenting Text: tutorials/segmentation.md
    - Conjuncts and ZWJ: tutorials/conjuncts.md
    - Phonetic Decomposition: tutorials/decomposition.md
  - How-To Guides:
    - NLP Evaluation: how-to/nlp-evaluation.md
    - Grapheme Segmentation: how-to/grapheme-segmentation.md
    - Phonetic Decomposition: how-to/decompose-phonetics.md
    - Command Line Usage: how-to/cli-usage.md
  - API Reference:
    - Metrics: reference/metrics.md
    - Distance: reference/distance.md
    - Graphemizer: reference/graphemizer.md
    - Decomposer: reference/decomposer.md
    - Composer: reference/composer.md
  - Explanation:
    - Evaluation Metrics: explanation/evaluation-metrics.md
    - System Architecture: explanation/system-architecture.md
    - Tamil Script Rules: explanation/tamil-script-rules.md
    - Sinhala Script Rules: explanation/sinhala-script-rules.md

copyright: Copyright &copy; 2025 - 2026 vmenan
