[project]
name = "grapheme-kit"
version = "0.1.1"
description = "A grapheme-aware toolkit for segmenting, comparing, and evaluating text across any script or language"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "vmenan", email = "themachinequest@gmail.com" }
]
keywords = [
    "grapheme",
    "graphemes",
    "tamil",
    "sinhala",
    "unicode",
    "nlp",
    "segmentation",
    "tokenization",
    "chrf",
    "cer",
    "edit-distance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "grapheme>=0.6.0",
    "sacrebleu>=2.6.0",
    "textdistance>=4.6.3",
]

[project.urls]
Homepage = "https://github.com/vmenan/grapheme-kit"
Repository = "https://github.com/vmenan/grapheme-kit"
Issues = "https://github.com/vmenan/grapheme-kit/issues"

[project.scripts]
grapheme-kit = "grapheme_kit.cli:main"
gkit = "grapheme_kit.cli:main"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "jupyter>=1.1.1",
    "ipykernel>=6.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.12.0"]
build-backend = "uv_build"

